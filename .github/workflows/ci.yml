name: CI

# Triggers: every branch push gets CI (agent/feature branches often have no PR),
# plus pull_request so PRs from forks are tested. To avoid running everything
# twice for a same-repo PR (push + pull_request on the same commit), each root
# job skips the pull_request event when the PR head lives in this repository:
# the push run already covers that commit. Fork PRs have no push run here, so
# they still run on pull_request.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede stale runs on branches/PRs, but let every commit on main finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  OPENSPEC_TELEMETRY: "0"

jobs:
  typecheck-test:
    name: typecheck · test (Node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  coverage:
    name: coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Node's built-in coverage (no extra deps). Fails below the thresholds
      # set in the test:coverage script.
      - name: Test with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.mjs lcov.info >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: ignore

  spec:
    name: openspec validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate OpenSpec specs and changes
        run: npm run spec:validate

  demo:
    name: offline demo
    needs: typecheck-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Offline demo (full reflection loop, no API key)
        run: npm run demo -- --quiet --out runs

      - name: Upload demo run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-demo-run
          path: runs/
          if-no-files-found: ignore
